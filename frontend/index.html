<!DOCTYPE html>

    .btn-restrito { background: #FACC15; color: #0F172A; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; min-height: 44px; cursor: pointer; }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    .filtros { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filtro-btn { border: 2px solid #0F3D5E; background: #FFFFFF; color: #0F3D5E; padding: 10px 14px; border-radius: 20px; font-weight: bold; min-height: 44px; cursor: pointer; }
    .filtro-btn.ativo { background: #0F3D5E; color: #FFFFFF; }
    .card { background: #FFFFFF; border: 1px solid #CBD5E1; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .selo-pronta { background: #DCFCE7; color: #14532D; padding: 4px 10px; border-radius: 6px; font-weight: bold; display: inline-block; }
    .selo-encomenda { background: #FEF3C7; color: #78350F; padding: 4px 10px; border-radius: 6px; font-weight: bold; display: inline-block; }
    .btn-whats { display: block; text-align: center; background: #14532D; color: #FFFFFF; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 12px; min-height: 44px; }
    .agenda { border: 2px solid #1D4ED8; background: #EFF6FF; padding: 14px; border-radius: 10px; }

</head>
