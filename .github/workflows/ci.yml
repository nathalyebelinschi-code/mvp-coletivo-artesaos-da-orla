name: CI — Validacao do MVP Coletivo Artesaos da Orla
on:
  push:
    branches: [ main, principal ]
  pull_request:
    branches: [ main, principal ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Validar estrutura e sintaxe do MVP
        run: |
          test -n "$(find . -name 'index.html')"
          test -n "$(find . -name 'painel-artesao.html')"
          javac -d /tmp $(find . -name "PecaService.java")
          echo "Build e validacao concluidos com sucesso!"
